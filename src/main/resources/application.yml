spring:
  application:
    name: nhaminh-api
  profiles:
    default: mysql
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/nhaminh;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: false
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
server:
  port: ${PORT:8080}
app:
  frontend-url: ${FRONTEND_URL:http://127.0.0.1:5173}
  mail:
    from: ${MAIL_FROM:}
    # TẠM TẮT xác minh email để test khi chưa có SMTP: đăng ký/đổi email có hiệu lực ngay, không gửi thư.
    # Trước khi deploy thật: đặt MAIL_VERIFICATION_ENABLED=true và cấu hình MAIL_USERNAME/MAIL_PASSWORD.
    verification-enabled: ${MAIL_VERIFICATION_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-before-deploying-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
