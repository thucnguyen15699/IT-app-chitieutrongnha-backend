# Môi trường PRODUCTION (<tên-miền> chính): người dùng thật.
# Kích hoạt: SPRING_PROFILES_ACTIVE=mysql,prd
app:
  jwt:
    secret: ${JWT_SECRET}            # bắt buộc, không có giá trị mặc định
  mail:
    verification-enabled: ${MAIL_VERIFICATION_ENABLED:true}
  security:
    # Từ chối khởi động nếu JWT_SECRET yếu hoặc admin còn mật khẩu mặc định.
    enforce-strong-secrets: true

spring:
  datasource:
    password: ${DB_PASSWORD}         # bắt buộc
    hikari:
      maximum-pool-size: 10
  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    vn.nhaminh: INFO
    org.springframework.boot.StartupInfoLogger: INFO

server:
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: always
