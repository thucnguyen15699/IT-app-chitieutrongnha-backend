spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chitieugiadinh?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
