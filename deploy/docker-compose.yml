# Một môi trường (dev / test / prd) = 1 bộ: MySQL + backend + frontend(nginx).
# Dùng chung file này cho cả 3, khác nhau ở file .env và tên project:
#   docker compose -p nhaminh-prd -f backend/deploy/docker-compose.yml --env-file /opt/nhaminh/prd/.env up -d --build
# (scripts/deploy.sh làm sẵn việc này.)
#
# Không mở cổng nào ra ngoài server: người dùng vào qua Cloudflare Tunnel (xem edge/docker-compose.yml),
# tunnel gọi tới container web qua mạng "nhaminh-edge" bằng tên nhaminh-<env>-web.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chitieugiadinh
      MYSQL_USER: nhaminh
      MYSQL_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Thiếu DB_ROOT_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-128M}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]

  backend:
    build:
      context: ${BACKEND_DIR:-..}
    image: nhaminh-backend:${APP_ENV:?Thiếu APP_ENV}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      SPRING_PROFILES_ACTIVE: mysql,${APP_ENV}
      DB_URL: jdbc:mysql://db:3306/chitieugiadinh?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: nhaminh
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:?Thiếu FRONTEND_URL trong .env}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_VERIFICATION_ENABLED: ${MAIL_VERIFICATION_ENABLED:-false}
      H2_CONSOLE_ENABLED: "false"
      JAVA_OPTS: -Xmx${JAVA_HEAP:-384m} -Duser.timezone=Asia/Ho_Chi_Minh
    networks: [internal]

  web:
    build:
      context: ${FRONTEND_DIR:-../../frontend}
    image: nhaminh-frontend:${APP_ENV}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend:8080
      ROBOTS_TAG: ${ROBOTS_TAG:-noindex, nofollow}
    networks:
      internal: {}
      edge:
        aliases:
          - nhaminh-${APP_ENV}-web

networks:
  internal: {}
  edge:
    external: true
    name: nhaminh-edge

volumes:
  db-data: {}
